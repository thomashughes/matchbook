# Alembic config. The database URL is *not* set here — it's injected from
# the DATABASE_URL_SYNC env var in alembic/env.py. Committing a URL would
# either leak creds or be wrong for every environment.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timezone-aware UTC timestamps in migration filenames — clearer history
# when multiple developers create migrations on the same day.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

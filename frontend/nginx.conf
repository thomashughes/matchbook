# Nginx config for the Matchbook SPA.
#
# Key behaviours:
#   - try_files ... /index.html: client-side routes (React Router) must
#     serve index.html instead of 404ing so /login, /verify-email, etc.
#     all load the app shell.
#   - Long cache on hashed assets, short on index.html: Vite emits
#     content-hashed filenames for JS/CSS, so those are safe to cache
#     aggressively; index.html must be fresh so users pick up new builds.
#   - Security headers live in security-headers.inc and are `include`d
#     into every location block. nginx's add_header does not inherit
#     when an inner block declares its own add_header, so the include
#     pattern is required to keep CSP/HSTS/etc. on every response.

server {
    # Unprivileged nginx image cannot bind a port <1024. Listen on 8080;
    # docker-compose maps host:3085 → container:8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress nginx version banner. The default `Server: nginx/1.x.x`
    # tells an attacker exactly which CVE list to consult; without it
    # they have to fingerprint behaviourally.
    server_tokens off;

    # Drop Plesk's default `X-Powered-By: PleskLin` if Apache fronts us.
    proxy_hide_header X-Powered-By;

    # Server-scope security headers — applied to any response from a
    # location block that declares no add_header of its own (e.g. the
    # SPA fallback `location /` and any returned 404 from the deny rules).
    include /etc/nginx/conf.d/security-headers.inc;

    # --- Sensitive-path lockdown -------------------------------------------
    # The SPA fallback at `/` rewrites unknown paths to index.html, which
    # otherwise makes /.env, /.git/config, /server-status etc. all 200.
    # That breaks 404 monitoring and gives scanners false positives.
    # 404 these explicitly *before* the SPA fallback gets them.
    location ~ /\.(?!well-known) { return 404; }
    location = /server-status { return 404; }
    location = /server-info  { return 404; }
    location ~* \.(sql|env|bak|swp|ya?ml|ini|log)$ { return 404; }

    # Hashed static assets — immutable = aggressive year-long cache.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA entrypoint — no cache so deploys take effect immediately.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy API calls to the FastAPI backend over the compose network.
    # Using `backend:8000` (Docker DNS) keeps the browser same-origin with
    # the SPA, so cookies work and we avoid a CORS preflight on every call.
    # NOTE: no security-headers include here — the FastAPI backend sets
    # its own X-Content-Type-Options/X-Frame-Options/Referrer-Policy and
    # we don't want to double-set them.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CV uploads can be up to 5MB; default nginx limit is 1MB.
        client_max_body_size 10m;
        # Claude + web_search for company research can run 30-120s when
        # the SDK retries on connection drops. nginx default of 60s would
        # surface as a 504 Gateway Timeout mid-call. 240s gives the
        # backend-side 220s cap (see ai_service) enough margin to return
        # cleanly before nginx gives up.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
